services:
  db:
    image: postgres:16-alpine
    container_name: helmes-db
    environment:
      POSTGRES_DB: helmes
      POSTGRES_USER: helmes
      POSTGRES_PASSWORD: helmes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmes -d helmes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
